name: Datos oficiales

on:
  schedule:
    - cron: '17 10 * * *'   # todos los días 07:17 (Buenos Aires), antes de la actualización del monitor
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['pipeline/**', '.github/workflows/datos.yml']

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas openpyxl
      - name: Descargar datos
        run: python pipeline/fetch_data.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Datos oficiales $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
